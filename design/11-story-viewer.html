<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mobile Story Viewer</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2b9dee",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101a22",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        /* Custom Safe Area utilities for iOS feel */
        .pt-safe {
            padding-top: env(safe-area-inset-top, 44px);
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 34px);
        }
        
        /* Hide scrollbar */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-dark font-display antialiased overflow-hidden">
<!-- Main Container -->
<div class="relative h-screen w-full overflow-hidden bg-black group/design-root">
<!-- Background Image Layer -->
<!-- Using a high-quality pool villa sunset image -->
<div class="absolute inset-0 z-0 bg-cover bg-center bg-no-repeat transform scale-105" data-alt="Luxury infinity pool villa with ocean view during a golden sunset" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuC0y8vzYsdswnaubF6-nZaaV0ZGJs-kwaiqern8g_qtEyD9MoTrgb-ikG5ws-nZ3onSXbTZEP7eaAHOy0o_4EnnkoOoxhdBOtmEWWgv2uyOyBJqYeuZxUuZNCvwMwDtrcysbx0jX3yzJ6Gt2ykIKgSdWuC2Due15vaj-hwW7uAWxsKGLCiZe69FPq35_O9SXV2R2WC5l4vW96YtdRZ4PFCgdKckkkRXE93VDjsSFFUutha4xTeas4ysYNOY8C9ntprSxySX9MpkloI');">
</div>
<!-- Gradient Overlays for Readability -->
<div class="absolute inset-0 z-10 bg-gradient-to-b from-black/70 via-transparent to-black/90 pointer-events-none"></div>
<!-- Touch Navigation Zones (Invisible) -->
<!-- These simulate the left/right tap areas common in stories -->
<div class="absolute inset-0 z-20 flex w-full h-full">
<div aria-label="Previous Story" class="w-1/3 h-full cursor-pointer"></div>
<div aria-label="Next Story" class="w-2/3 h-full cursor-pointer"></div>
</div>
<!-- UI Content Layer (Pointer events auto where interaction is needed) -->
<div class="relative z-30 flex flex-col justify-between h-full pt-safe pb-safe pointer-events-none">
<!-- Top Section: Progress & Controls -->
<div class="flex flex-col w-full px-3 pt-3 gap-4 pointer-events-auto">
<!-- Progress Indicators -->
<div class="flex w-full flex-row items-center justify-center gap-1.5">
<!-- Active Segment -->
<div class="h-1 flex-1 rounded-full bg-primary shadow-[0_0_10px_rgba(43,157,238,0.5)]"></div>
<!-- Inactive Segments -->
<div class="h-1 flex-1 rounded-full bg-white/30 backdrop-blur-sm"></div>
<div class="h-1 flex-1 rounded-full bg-white/30 backdrop-blur-sm"></div>
<div class="h-1 flex-1 rounded-full bg-white/30 backdrop-blur-sm"></div>
</div>
<!-- Header Row -->
<div class="flex items-center justify-between px-1">
<!-- Host/User Info (Left) -->
<div class="flex items-center gap-2.5">
<div class="h-9 w-9 overflow-hidden rounded-full border border-white/20">
<div class="w-full h-full bg-cover bg-center" data-alt="Host profile portrait" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAd7S7hHW_oGIiiB-Z0L0ZNEwe4XRpyb8y256CmfE3WFgdDmsTKaW3xXhiWgFuosnHUq1NV8HZE6cv90Xp-535xOUJEusc1fKU5LAFHiXAi-a50gMeDR_W5AAu6I6MI4_938O_HvRBogyJegFm3XJ8bpDD_tCUJSnQ9MqlkuMmmfNHX6P3LtiFHxu-sYLP0JT_7Q-KT2y1LvaX1LhlZjDI3BntaiYacprUW4YVnbH78NGXOfFolYvlQjRTTnfT553Dbaq9TqjzRLuU')"></div>
</div>
<div class="flex flex-col text-white drop-shadow-md">
<span class="text-sm font-bold leading-none tracking-wide">Jeju Stay</span>
<span class="text-[10px] font-medium opacity-80 mt-0.5">Sponsored</span>
</div>
</div>
<!-- Close Button (Right) -->
<button class="flex h-10 w-10 items-center justify-center rounded-full bg-black/20 text-white backdrop-blur-md transition-transform active:scale-95 hover:bg-black/40">
<span class="material-symbols-outlined text-[24px]" data-icon="close">close</span>
</button>
</div>
</div>
<!-- Middle Section: Typography & Greeting -->
<div class="flex flex-col items-center justify-center px-6 w-full text-center pointer-events-none">
<h1 class="text-white text-[32px] md:text-[40px] font-bold leading-[1.15] tracking-tight drop-shadow-xl mb-8">
                    제주 오션뷰 풀빌라에<br/>오신 것을 환영합니다!
                </h1>
<!-- Host Greeting Pill -->
<div class="bg-white/10 backdrop-blur-md border border-white/10 rounded-2xl p-4 flex items-start gap-3 max-w-sm text-left shadow-2xl">
<div class="bg-primary rounded-full p-1.5 shrink-0 flex items-center justify-center">
<span class="material-symbols-outlined text-white text-[16px]">verified_user</span>
</div>
<div class="flex flex-col gap-1">
<span class="text-xs font-bold text-primary uppercase tracking-wider">Host Message</span>
<p class="text-sm font-medium text-white/95 leading-relaxed">
                            "Enjoy a private sunset swim in our heated infinity pool while watching the waves."
                        </p>
</div>
</div>
</div>
<!-- Bottom Section: CTA -->
<div class="flex flex-col items-center justify-end w-full px-6 pb-8 gap-3 pointer-events-auto">
<button class="group flex items-center justify-center gap-2 bg-primary hover:bg-[#208ad4] active:scale-95 transition-all text-white px-8 py-4 rounded-full w-full max-w-[280px] shadow-lg shadow-primary/25">
<span class="text-base font-bold tracking-wide">자세히 보기</span>
<span class="material-symbols-outlined text-[20px] group-hover:-translate-y-0.5 transition-transform duration-300">arrow_upward</span>
</button>
<div class="flex flex-col items-center gap-1 opacity-60">
<span class="material-symbols-outlined text-white text-[20px]">keyboard_arrow_up</span>
</div>
</div>
</div>
</div>
</body></html>
