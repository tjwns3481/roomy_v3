<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Roomy Sign Up</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts: Inter and Noto Sans KR -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#2b9dee",
              "background-light": "#f6f7f8",
              "background-dark": "#101a22",
              "kakao": "#FEE500",
              "kakao-text": "#391B1B",
            },
            fontFamily: {
              "display": ["Inter", "Noto Sans KR", "sans-serif"],
              "body": ["Inter", "Noto Sans KR", "sans-serif"],
            },
            borderRadius: {
                "DEFAULT": "0.5rem", 
                "lg": "0.5rem",  // Overriding to match standard lg
                "xl": "0.75rem", 
                "2xl": "1rem",
                "3xl": "1.5rem", // 24px
                "full": "9999px"
            },
            boxShadow: {
                "soft": "0 20px 40px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01)",
            }
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
        }
        /* Custom checkbox style adjustment */
        .custom-checkbox:checked {
            background-color: #2b9dee;
            border-color: #2b9dee;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white antialiased transition-colors duration-200">
<div class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 lg:p-8 relative overflow-hidden">
<!-- Decorative Background Elements -->
<div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-blue-400/5 rounded-full blur-[120px]"></div>
</div>
<!-- Main Card Container -->
<div class="w-full max-w-[440px] bg-white dark:bg-slate-800 rounded-3xl shadow-soft dark:shadow-2xl border border-white/50 dark:border-slate-700/50 p-8 sm:p-10 relative z-10">
<!-- Header Section -->
<div class="flex flex-col items-center text-center mb-8">
<div class="flex items-center gap-2 mb-6">
<div class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[28px]" data-icon="cottage">cottage</span>
</div>
<span class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Roomy</span>
</div>
<h1 class="text-2xl font-bold text-slate-900 dark:text-white mb-2">무료로 시작하기</h1>
<p class="text-slate-500 dark:text-slate-400 text-sm font-normal">3분만에 첫 가이드를 만들어보세요</p>
</div>
<!-- Sign Up Form -->
<form action="#" class="flex flex-col gap-4">
<!-- Email Field -->
<div class="space-y-1">
<label class="sr-only" for="email">이메일</label>
<input class="w-full h-12 px-4 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-sm" id="email" placeholder="이메일" type="email"/>
</div>
<!-- Password Field -->
<div class="space-y-1 relative group">
<label class="sr-only" for="password">비밀번호</label>
<div class="relative">
<input class="w-full h-12 px-4 pr-12 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-sm" id="password" placeholder="비밀번호 (8자 이상)" type="password"/>
<button class="absolute right-0 top-0 h-full px-4 flex items-center justify-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password Field -->
<div class="space-y-1">
<label class="sr-only" for="confirm_password">비밀번호 확인</label>
<input class="w-full h-12 px-4 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all text-sm" id="confirm_password" placeholder="비밀번호 확인" type="password"/>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-3 mt-1 mb-2">
<div class="flex items-center h-5">
<input class="w-4 h-4 border border-slate-300 rounded bg-gray-50 focus:ring-3 focus:ring-primary/20 custom-checkbox dark:bg-slate-700 dark:border-slate-600" id="terms" type="checkbox"/>
</div>
<label class="text-xs text-slate-500 dark:text-slate-400 leading-5" for="terms">
<a class="text-primary hover:underline font-medium" href="#">이용약관</a> 및 <a class="text-primary hover:underline font-medium" href="#">개인정보처리방침</a>에 동의합니다
                    </label>
</div>
<!-- Submit Button -->
<button class="w-full h-12 bg-primary hover:bg-blue-600 text-white font-semibold rounded-lg shadow-sm hover:shadow transition-all duration-200 flex items-center justify-center gap-2" type="button">
                    가입하기
                </button>
</form>
<!-- Divider -->
<div class="relative flex py-6 items-center">
<div class="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
<span class="flex-shrink-0 mx-4 text-xs text-slate-400 font-medium">또는</span>
<div class="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
</div>
<!-- Social Sign Up -->
<div class="flex flex-col gap-3">
<!-- Google Button -->
<button class="w-full h-12 bg-white dark:bg-slate-700 hover:bg-slate-50 dark:hover:bg-slate-600 border border-slate-200 dark:border-slate-600 rounded-lg flex items-center justify-center gap-3 transition-colors duration-200 group" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="text-sm font-medium text-slate-700 dark:text-slate-200 group-hover:text-slate-900 dark:group-hover:text-white">Google로 시작하기</span>
</button>
<!-- Kakao Button -->
<button class="w-full h-12 bg-[#FEE500] hover:bg-[#FDD835] rounded-lg flex items-center justify-center gap-3 transition-colors duration-200" type="button">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M12 3C6.477 3 2 6.358 2 10.5C2 13.208 3.737 15.586 6.368 16.885L5.344 20.697C5.234 21.107 5.686 21.43 5.996 21.157L10.667 17.584C11.104 17.625 11.548 17.647 12 17.647C17.523 17.647 22 14.289 22 10.147C22 6.005 17.523 3 12 3Z" fill="#391B1B" fill-rule="evenodd"></path>
</svg>
<span class="text-sm font-medium text-[#391B1B]/85">카카오로 시작하기</span>
</button>
</div>
<!-- Login Link Footer -->
<div class="mt-8 text-center">
<p class="text-sm text-slate-500 dark:text-slate-400">
                    이미 계정이 있으신가요? 
                    <a class="text-primary font-semibold hover:underline ml-1" href="#">로그인</a>
</p>
</div>
</div>
<!-- Bottom copyright or extra info (Optional visual balance) -->
<div class="mt-8 text-slate-400 text-xs text-center">
            © 2024 Roomy Inc. All rights reserved.
        </div>
</div>
</body></html>
