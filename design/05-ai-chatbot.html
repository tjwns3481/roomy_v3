<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AI Concierge Chat</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#2b9dee",
              "background-light": "#f6f7f8",
              "background-dark": "#101a22",
            },
            fontFamily: {
              "display": ["Plus Jakarta Sans", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
            boxShadow: {
                'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
            }
          },
        },
      }
    </script>
<style>
        /* Hide scrollbar for Chrome, Safari and Opera */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .scrollbar-hide {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-gray-100 dark:bg-black font-display text-[#111518] dark:text-white flex justify-center min-h-screen">
<!-- Mobile Container Simulator -->
<div class="relative flex h-screen w-full max-w-[430px] flex-col overflow-hidden bg-background-light dark:bg-background-dark shadow-2xl sm:my-4 sm:rounded-[32px] sm:h-[850px] border-gray-200 dark:border-gray-800 sm:border">
<!-- Header -->
<header class="flex items-center justify-between px-5 py-4 bg-white/80 dark:bg-[#101a22]/80 backdrop-blur-md sticky top-0 z-50 border-b border-gray-100 dark:border-gray-800">
<button class="flex items-center justify-center -ml-2 p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-[#111518] dark:text-white transition-colors group">
<span class="material-symbols-outlined group-hover:-translate-x-0.5 transition-transform">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<h1 class="text-base font-bold leading-tight tracking-tight">AI 컨시어지</h1>
<span class="text-[10px] text-primary font-medium flex items-center gap-1">
<span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
                    Online
                </span>
</div>
<div class="flex items-center justify-center size-10 rounded-full bg-primary/10 text-primary">
<span class="material-symbols-outlined filled">smart_toy</span>
</div>
</header>
<!-- Chat Area -->
<main class="flex-1 overflow-y-auto px-4 pt-4 pb-2 space-y-6 bg-background-light dark:bg-background-dark scroll-smooth">
<!-- AI Message 1 -->
<div class="flex items-end gap-3 animate-fade-in-up">
<div class="size-9 rounded-full bg-gray-200 shrink-0 overflow-hidden bg-cover bg-center border border-white dark:border-gray-700 shadow-sm" data-alt="Cute 3D robot avatar representing the AI concierge" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuADIi_O6ztYXQNYHDJ8HxDb2sN9yslNDi4S1iId_y81C74kghxO9XmvhMswYhDsIRdCTkOZjYaphK8VTqkPa0cHKQFyojhCiO30WZkOF5fF31VkyS3x_52dpumucFVcvvYrRCC2o82XXJ7OmjqZjh8JZiUc4SVM8G-ydYeXkCP3_k6Qk81OGu0YEvIHebkb0vq79HkEDg2mHn5il6LhYArnYyDv8JZkTob3-PkzLwZwK0H7bjVKmeNOTtMkOo5WMKFzb7Qr141TAQo');"></div>
<div class="flex flex-col items-start gap-1 max-w-[80%]">
<span class="text-[11px] text-gray-500 dark:text-gray-400 ml-3 font-medium">AI 컨시어지</span>
<div class="p-3.5 px-4 rounded-2xl rounded-tl-sm bg-white dark:bg-[#1e2a34] shadow-soft text-[15px] leading-relaxed text-[#111518] dark:text-gray-100">
                        안녕하세요! 제주 오션뷰 풀빌라 AI 컨시어지입니다 🏠
                    </div>
</div>
</div>
<!-- AI Message 2 -->
<div class="flex items-end gap-3">
<div class="size-9 rounded-full opacity-0 shrink-0"></div> <!-- Spacer for alignment -->
<div class="flex flex-col items-start gap-1 max-w-[80%]">
<div class="p-3.5 px-4 rounded-2xl rounded-tl-sm bg-white dark:bg-[#1e2a34] shadow-soft text-[15px] leading-relaxed text-[#111518] dark:text-gray-100">
                        숙소에 대해 궁금한 점이 있으시면 편하게 물어보세요!
                    </div>
</div>
</div>
<!-- Chips -->
<div class="flex gap-2.5 overflow-x-auto pb-2 pt-1 scrollbar-hide -mx-4 px-4 w-[calc(100%+32px)]">
<button class="flex-shrink-0 pl-3 pr-4 py-2.5 rounded-2xl bg-white dark:bg-[#1e2a34] border border-primary/30 text-primary text-[13px] font-semibold hover:bg-primary/5 active:bg-primary/10 transition-all shadow-sm flex items-center gap-1.5 whitespace-nowrap">
<span class="material-symbols-outlined text-[18px]">wifi</span>
                    Wi-Fi 비밀번호가 뭔가요?
                </button>
<button class="flex-shrink-0 px-4 py-2.5 rounded-2xl bg-white dark:bg-[#1e2a34] border border-transparent text-[#111518] dark:text-gray-200 text-[13px] font-medium hover:bg-gray-50 dark:hover:bg-gray-800 transition-all shadow-sm whitespace-nowrap">
                    체크아웃은 몇 시인가요?
                </button>
<button class="flex-shrink-0 px-4 py-2.5 rounded-2xl bg-white dark:bg-[#1e2a34] border border-transparent text-[#111518] dark:text-gray-200 text-[13px] font-medium hover:bg-gray-50 dark:hover:bg-gray-800 transition-all shadow-sm whitespace-nowrap">
                    주변 맛집 추천해주세요
                </button>
<button class="flex-shrink-0 px-4 py-2.5 rounded-2xl bg-white dark:bg-[#1e2a34] border border-transparent text-[#111518] dark:text-gray-200 text-[13px] font-medium hover:bg-gray-50 dark:hover:bg-gray-800 transition-all shadow-sm whitespace-nowrap">
                    에어컨 어떻게 켜나요?
                </button>
</div>
<!-- User Message -->
<div class="flex items-end gap-3 justify-end">
<div class="flex flex-col items-end gap-1 max-w-[80%]">
<div class="p-3.5 px-4 rounded-2xl rounded-br-sm bg-primary text-white shadow-md shadow-primary/20 text-[15px] leading-relaxed">
                        와이파이 비밀번호 알려주세요
                    </div>
<span class="text-[10px] text-gray-400 mr-1 font-medium">오후 2:30</span>
</div>
</div>
<!-- AI Response (Rich) -->
<div class="flex items-end gap-3">
<div class="size-9 rounded-full bg-gray-200 shrink-0 overflow-hidden bg-cover bg-center border border-white dark:border-gray-700 shadow-sm" data-alt="Cute 3D robot avatar representing the AI concierge" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCWWO9epbelkaa5Iaw71gg4MQmWer9hOJxKiidMiM32G2z5t3uYtUo0ojXhEBJzMojSFbj2ID3HOO359hjQlDeeG7TVr__fx7kUcCeF7_YBfyRUC0gqm92fSXD3QkTIlMUu4xtgCU-Vufqzs_c8YA-HyLnyfGgfOJMdG1eUfoIXQNDAu9Ny7ATW2klFOHD8QD7YmxLuxeyx3YC-fA08z5MwWIpycHF6Vr44xqszVvk7GQishSFP3xur8M7owXZWeAJbgCWopM1Ox9E');"></div>
<div class="flex flex-col items-start gap-1 max-w-[88%] w-full">
<span class="text-[11px] text-gray-500 dark:text-gray-400 ml-3 font-medium">AI 컨시어지</span>
<div class="p-1 rounded-2xl rounded-tl-sm bg-white dark:bg-[#1e2a34] shadow-soft text-sm text-[#111518] dark:text-gray-100 border border-transparent dark:border-gray-800 w-full overflow-hidden">
<!-- Card Header inside bubble -->
<div class="px-4 py-3 border-b border-gray-50 dark:border-gray-700/50">
<p class="font-bold flex items-center gap-2 text-base">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">wifi</span>
                                Wi-Fi 정보입니다
                            </p>
</div>
<!-- Card Body -->
<div class="p-4 space-y-4">
<div class="bg-background-light dark:bg-[#152028] p-4 rounded-xl space-y-3 border border-gray-100 dark:border-gray-700/50">
<div class="flex justify-between items-center">
<span class="text-gray-500 dark:text-gray-400 text-xs font-medium">네트워크</span>
<span class="font-bold text-sm tracking-wide">OceanVilla_5G</span>
</div>
<div class="h-px w-full bg-gray-200 dark:bg-gray-700"></div>
<div class="flex justify-between items-center">
<span class="text-gray-500 dark:text-gray-400 text-xs font-medium">비밀번호</span>
<span class="font-bold text-sm tracking-wide font-mono">jeju2024!</span>
</div>
</div>
<p class="text-[13px] text-gray-500 dark:text-gray-400 leading-relaxed">
                                아래 버튼을 눌러 비밀번호를 복사한 뒤,<br/>설정에서 쉽게 연결하세요.
                            </p>
<button class="group flex items-center justify-center w-full gap-2 py-3 rounded-xl bg-primary hover:bg-primary/90 text-white font-bold text-sm transition-all shadow-md shadow-primary/20 active:scale-[0.98]">
<span class="material-symbols-outlined text-[18px]">content_copy</span>
                                비밀번호 복사하기
                            </button>
</div>
</div>
</div>
</div>
<!-- Spacer for scrolling comfort -->
<div class="h-2"></div>
</main>
<!-- Bottom Input & Footer -->
<footer class="bg-white dark:bg-[#101a22] p-4 sticky bottom-0 z-20 pb-6 sm:pb-4 shadow-[0_-4px_20px_rgba(0,0,0,0.03)] border-t border-gray-50 dark:border-gray-800">
<!-- Input Bar -->
<div class="relative flex items-end gap-2 mb-4 bg-background-light dark:bg-[#1e2a34] rounded-[24px] p-1.5 pr-2 transition-shadow focus-within:ring-2 focus-within:ring-primary/20">
<button class="h-10 w-10 shrink-0 text-gray-400 hover:text-primary transition-colors flex items-center justify-center">
<span class="material-symbols-outlined">add_circle</span>
</button>
<input class="w-full h-10 bg-transparent border-none focus:ring-0 text-[15px] text-[#111518] dark:text-white placeholder-gray-400 pb-2.5" placeholder="메시지를 입력하세요..." type="text"/>
<button class="h-10 w-10 shrink-0 bg-primary rounded-full flex items-center justify-center text-white hover:bg-primary/90 transition-transform active:scale-95 shadow-md shadow-primary/30">
<span class="material-symbols-outlined text-[20px] ml-0.5 mt-0.5">arrow_upward</span>
</button>
</div>
<!-- Helper Footer -->
<div class="text-center">
<p class="text-[11px] text-gray-400 dark:text-gray-500 leading-normal flex items-center justify-center gap-1 flex-wrap">
                    AI가 답변하기 어려운 경우 
                    <span class="hidden sm:inline">|</span>
<a class="text-primary font-bold hover:underline inline-flex items-center gap-1 px-2 py-1 rounded-md hover:bg-primary/5 transition-colors" href="#">
<span class="material-symbols-outlined text-[14px] filled">call</span> 호스트 연락하기
                    </a>
</p>
</div>
</footer>
</div>
</body></html>
