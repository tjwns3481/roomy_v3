<!DOCTYPE html>

<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Roomy - Login</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0d7ff2",
                        "background-light": "#f5f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "Noto Sans KR", "sans-serif"],
                        "sans": ["Plus Jakarta Sans", "Noto Sans KR", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom styles for specific needs not covered by Tailwind utilities */
        .glass-effect {
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#111418] antialiased">
<div class="relative min-h-screen w-full flex items-center justify-center overflow-hidden">
<!-- Background Layer with Image and Overlay -->
<div class="absolute inset-0 z-0">
<!-- Architectural Background Image -->
<div class="absolute inset-0 bg-cover bg-center bg-no-repeat" data-alt="Modern luxury villa interior with large windows and sunlight" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBxaTsBOo8A33JC5OL_uvC9UF5ckyIKNMe6NG7jofeXZbXuSso2Qo3sQYEF-CfdcmmrRsJCLf0NisPUlzwxPpSThBalUGLcmHcCLdZZNB88n_t01B_tLrwJLLkJUCYou3IRVQ6UyoMlTw7rEcC8BBubfUklNKEA_rthbScQqlPXV0lDvxXyOe9NAjQlrRi4CAemVruOyJ96sCG8jPOJ3ONYOVnDuvdo__1Hy7uDYQ8n0PWg5pUci1myThlI7N9_1iG2ayh7LLnMghs");'></div>
<!-- Heavy Gradient Overlay for Readability -->
<div class="absolute inset-0 bg-gradient-to-br from-white/90 via-[#f5f7f8]/85 to-white/60 dark:from-[#101922]/95 dark:via-[#101922]/90 dark:to-[#101922]/80 backdrop-blur-[2px]"></div>
</div>
<!-- Main Content Container -->
<div class="relative z-10 w-full max-w-[480px] p-4">
<!-- Central Card -->
<div class="bg-white dark:bg-[#1a2632] rounded-[24px] shadow-2xl p-8 md:p-10 w-full flex flex-col gap-6">
<!-- Header Section -->
<div class="flex flex-col items-center text-center space-y-2">
<!-- Brand Logo -->
<div class="flex items-center gap-2 mb-2">
<div class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[28px]">home_app_logo</span>
</div>
<span class="text-2xl font-bold tracking-tight text-[#111418] dark:text-white">Roomy</span>
</div>
<!-- Subtitle -->
<h3 class="text-[#60758a] dark:text-[#9ca3af] text-sm md:text-base font-medium">숙소 가이드를 3분만에 만들어보세요</h3>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-4" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="flex flex-col gap-2">
<label class="text-[#111418] dark:text-white text-sm font-semibold" for="email">이메일</label>
<input class="form-input flex w-full rounded-lg border border-[#dbe0e6] dark:border-gray-600 bg-white dark:bg-gray-800 text-[#111418] dark:text-white focus:border-primary focus:ring-primary h-12 px-4 placeholder:text-[#9ca3af] text-base transition-colors" id="email" placeholder="이메일" type="email" value=""/>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<label class="text-[#111418] dark:text-white text-sm font-semibold" for="password">비밀번호</label>
<div class="relative flex w-full">
<input class="form-input flex w-full rounded-lg border border-[#dbe0e6] dark:border-gray-600 bg-white dark:bg-gray-800 text-[#111418] dark:text-white focus:border-primary focus:ring-primary h-12 pl-4 pr-12 placeholder:text-[#9ca3af] text-base transition-colors" id="password" placeholder="비밀번호" type="password" value=""/>
<button aria-label="Toggle password visibility" class="absolute right-0 top-0 h-12 w-12 flex items-center justify-center text-[#9ca3af] hover:text-[#60758a] dark:hover:text-white transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end">
<a class="text-[#60758a] dark:text-[#9ca3af] text-sm font-medium hover:text-primary dark:hover:text-primary transition-colors" href="#">
                            비밀번호를 잊으셨나요?
                        </a>
</div>
<!-- Submit Button -->
<button class="mt-2 w-full bg-primary hover:bg-blue-600 text-white font-bold h-12 rounded-lg transition-colors flex items-center justify-center shadow-md shadow-blue-500/20" type="submit">
                        로그인
                    </button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 py-1">
<div class="h-px flex-1 bg-[#e5e7eb] dark:bg-gray-700"></div>
<span class="text-[#9ca3af] text-sm font-medium">또는</span>
<div class="h-px flex-1 bg-[#e5e7eb] dark:bg-gray-700"></div>
</div>
<!-- Social Login Buttons -->
<div class="flex flex-col gap-3">
<!-- Google Button -->
<button class="w-full flex items-center justify-center gap-3 bg-white dark:bg-white h-12 rounded-lg border border-[#e5e7eb] hover:bg-gray-50 transition-colors group" type="button">
<!-- Google Icon SVG -->
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="text-[#111418] font-medium text-[15px]">Google로 계속하기</span>
</button>
<!-- Kakao Button -->
<button class="w-full flex items-center justify-center gap-3 bg-[#FEE500] hover:bg-[#FDD835] h-12 rounded-lg transition-colors" type="button">
<!-- Kakao Icon SVG -->
<svg class="w-5 h-5 text-[#3C1E1E]" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 3C7.58 3 4 5.28 4 8.5C4 10.59 5.34 12.44 7.42 13.4L6.59 16.5C6.54 16.69 6.74 16.86 6.91 16.74L10.74 14.19C11.15 14.23 11.57 14.25 12 14.25C16.42 14.25 20 11.97 20 8.75C20 5.53 16.42 3 12 3Z"></path>
</svg>
<span class="text-[#3C1E1E] font-medium text-[15px]">카카오로 계속하기</span>
</button>
</div>
<!-- Footer -->
<div class="flex items-center justify-center gap-1.5 pt-2">
<p class="text-[#60758a] dark:text-[#9ca3af] text-sm">계정이 없으신가요?</p>
<a class="text-primary font-bold text-sm hover:underline" href="#">회원가입</a>
</div>
</div>
<!-- Additional subtle branding or copyright footer could go here if needed -->
<div class="mt-8 text-center">
<p class="text-xs text-[#60758a] opacity-70">© 2024 Roomy Inc.</p>
</div>
</div>
</div>
</body></html>
