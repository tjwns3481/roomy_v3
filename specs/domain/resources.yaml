# Roomy v3 - Domain Resources (Finalized)
# Version: 1.0
# Finalized: 2026-02-03

resources:
  users:
    description: "사용자 정보 및 인증 (Clerk 호환)"
    fields:
      - name: id
        type: uuid
        primary: true
        default: "gen_random_uuid()"
      - name: clerk_id
        type: text
        unique: true
        required: true
      - name: email
        type: text
        unique: true
        required: true
      - name: name
        type: text
      - name: role
        type: text
        required: true
        default: "'host'"
        check: "role in ('host', 'admin')"
      - name: avatar_url
        type: text
      - name: phone
        type: text
      - name: created_at
        type: timestamptz
        default: "now()"
      - name: updated_at
        type: timestamptz
        default: "now()"
    indexes:
      - idx_users_clerk_id
      - idx_users_email
      - idx_users_role
    rls_enabled: true

  accommodations:
    description: "숙박시설 정보 (사용자별)"
    fields:
      - name: id
        type: uuid
        primary: true
        default: "gen_random_uuid()"
      - name: user_id
        type: uuid
        required: true
        references: "users.id (on delete cascade)"
      - name: name
        type: text
        required: true
      - name: address
        type: text
      - name: latitude
        type: numeric
      - name: longitude
        type: numeric
      - name: created_at
        type: timestamptz
        default: "now()"
      - name: updated_at
        type: timestamptz
        default: "now()"
    indexes:
      - idx_accommodations_user_id
    rls_enabled: true

  guides:
    description: "숙박 가이드 콘텐츠 (숙박시설별)"
    fields:
      - name: id
        type: uuid
        primary: true
        default: "gen_random_uuid()"
      - name: accommodation_id
        type: uuid
        required: true
        references: "accommodations.id (on delete cascade)"
      - name: slug
        type: text
        required: true
      - name: title
        type: text
        required: true
      - name: content_blocks
        type: jsonb
        required: true
        default: "'[]'::jsonb"
      - name: wifi_ssid
        type: text
      - name: wifi_password
        type: text
      - name: is_published
        type: boolean
        default: "false"
      - name: view_count
        type: integer
        default: "0"
      - name: created_at
        type: timestamptz
        default: "now()"
      - name: updated_at
        type: timestamptz
        default: "now()"
    constraints:
      - type: unique
        fields: [slug, accommodation_id]
    indexes:
      - idx_guides_accommodation_id
      - idx_guides_is_published
      - idx_guides_created_at
      - idx_guides_slug_accommodation
    rls_enabled: true

  stories:
    description: "가이드 스토리 미디어 (이미지/비디오)"
    fields:
      - name: id
        type: uuid
        primary: true
        default: "gen_random_uuid()"
      - name: guide_id
        type: uuid
        required: true
        references: "guides.id (on delete cascade)"
      - name: media_url
        type: text
        required: true
      - name: media_type
        type: text
        required: true
        check: "media_type in ('image', 'video')"
      - name: order_index
        type: integer
        default: "0"
      - name: label
        type: text
      - name: created_at
        type: timestamptz
        default: "now()"
    indexes:
      - idx_stories_guide_id
      - idx_stories_guide_id_order_index
    rls_enabled: true

  visits:
    description: "가이드 방문 기록 추적"
    fields:
      - name: id
        type: uuid
        primary: true
        default: "gen_random_uuid()"
      - name: guide_id
        type: uuid
        required: true
        references: "guides.id (on delete cascade)"
      - name: visitor_ip
        type: text
      - name: user_agent
        type: text
      - name: created_at
        type: timestamptz
        default: "now()"
    indexes:
      - idx_visits_guide_id
      - idx_visits_created_at
      - idx_visits_guide_id_created_at
    rls_enabled: true

  ai_conversations:
    description: "AI 챗봇 대화 기록 저장"
    fields:
      - name: id
        type: uuid
        primary: true
        default: "gen_random_uuid()"
      - name: guide_id
        type: uuid
        required: true
        references: "guides.id (on delete cascade)"
      - name: session_id
        type: text
        required: true
      - name: question
        type: text
        required: true
      - name: answer
        type: text
        required: true
      - name: created_at
        type: timestamptz
        default: "now()"
    indexes:
      - idx_ai_conversations_guide_id
      - idx_ai_conversations_session_id
      - idx_ai_conversations_created_at
    rls_enabled: true

entity_relationships:
  - from: users
    to: accommodations
    cardinality: "1:N"
    foreign_key: "user_id"
    cascade_delete: true
  - from: accommodations
    to: guides
    cardinality: "1:N"
    foreign_key: "accommodation_id"
    cascade_delete: true
  - from: guides
    to: stories
    cardinality: "1:N"
    foreign_key: "guide_id"
    cascade_delete: true
  - from: guides
    to: visits
    cardinality: "1:N"
    foreign_key: "guide_id"
    cascade_delete: true
  - from: guides
    to: ai_conversations
    cardinality: "1:N"
    foreign_key: "guide_id"
    cascade_delete: true

metadata:
  project: "Roomy v3"
  stack: "Next.js 15 + TypeScript + TailwindCSS + Supabase"
  total_tables: 6
  version: "1.0"
  finalized_at: "2026-02-03"
  status: "finalized"
