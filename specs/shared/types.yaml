# Roomy v3 - 공통 타입 정의
version: "1.0"

# 기본 타입
primitives:
  UUID: string  # format: uuid
  Timestamp: string  # format: ISO 8601
  Email: string  # format: email
  URL: string  # format: uri
  Phone: string  # format: phone (Korean)

# 사용자 관련
user:
  User:
    id: UUID
    email: Email
    name: string?
    role: UserRole
    avatar_url: URL?
    phone: Phone?
    created_at: Timestamp
    updated_at: Timestamp

  UserRole:
    enum: [host, admin]

  AuthState:
    isAuthenticated: boolean
    user: User?
    loading: boolean

# 가이드 관련
guide:
  Guide:
    id: UUID
    accommodation_id: UUID
    slug: string
    title: string
    content_blocks: ContentBlock[]
    wifi_ssid: string?
    wifi_password: string?
    is_published: boolean
    view_count: integer
    created_at: Timestamp
    updated_at: Timestamp

  ContentBlock:
    id: UUID
    type: BlockType
    order: integer
    data: BlockData

  BlockType:
    enum: [wifi, rules, devices, places, text, image, video, gallery, map, contact]

  BlockData:
    oneOf:
      - WifiBlockData
      - RulesBlockData
      - DevicesBlockData
      - PlacesBlockData
      - TextBlockData
      - ImageBlockData

  WifiBlockData:
    ssid: string
    password: string
    note: string?

  RulesBlockData:
    checkIn: string  # HH:mm
    checkOut: string  # HH:mm
    items: string[]

  DevicesBlockData:
    items: DeviceItem[]

  DeviceItem:
    name: string
    description: string
    imageUrl: URL?

  PlacesBlockData:
    items: PlaceItem[]

  PlaceItem:
    name: string
    category: PlaceCategory
    address: string
    mapUrl: URL?
    rating: number?
    isHostPick: boolean?

  PlaceCategory:
    enum: [restaurant, cafe, attraction, etc]

  TextBlockData:
    title: string
    content: string

  ImageBlockData:
    url: URL
    caption: string?

# 스토리 관련
story:
  Story:
    id: UUID
    guide_id: UUID
    media_url: URL
    media_type: MediaType
    order_index: integer
    label: string?
    created_at: Timestamp

  MediaType:
    enum: [image, video]

# AI 관련
ai:
  AIConversation:
    id: UUID
    guide_id: UUID
    session_id: string
    question: string
    answer: string
    created_at: Timestamp

  ChatMessage:
    id: string
    sender: MessageSender
    text: string
    timestamp: Timestamp

  MessageSender:
    enum: [user, ai]

# 방문 기록
visit:
  Visit:
    id: UUID
    guide_id: UUID
    visitor_ip: string?
    user_agent: string?
    created_at: Timestamp

# UI 상태
ui:
  ModalState:
    isOpen: boolean
    type: string?
    data: any?

  ToastState:
    visible: boolean
    message: string
    variant: ToastVariant

  ToastVariant:
    enum: [success, error, warning, info]

  LoadingState:
    isLoading: boolean
    message: string?

# API 응답
api:
  ApiResponse<T>:
    success: boolean
    data: T?
    error: ApiError?

  ApiError:
    code: string
    message: string
    details: any?

  PaginatedResponse<T>:
    items: T[]
    total: integer
    page: integer
    pageSize: integer
    hasMore: boolean
