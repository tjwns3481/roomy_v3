# 리소스별 사용 현황
resource_usage:
  user:
    used_by: [dashboard, settings, admin-dashboard]
    fields_used: [id, email, name, phone, avatar_url, role, created_at]

  guide:
    used_by: [dashboard, editor, qr-modal, guest-main, ai-chatbot, detail-rules, detail-places, admin-dashboard]
    fields_used: [id, title, slug, content_blocks, wifi_ssid, wifi_password, is_published, view_count, updated_at]

  story:
    used_by: [editor, guest-main, story-viewer]
    fields_used: [id, media_url, media_type, order_index]

  accommodation:
    used_by: [guest-main, detail-places]
    fields_used: [name, address]
    missing_fields: [latitude, longitude]

  ai_conversation:
    used_by: [ai-chatbot, admin-dashboard]
    fields_used: [id, question, answer, created_at, session_id]

  visit:
    used_by: [admin-dashboard]
    fields_used: [id, created_at]

# 권장 사항
recommendations:
